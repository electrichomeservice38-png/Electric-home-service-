{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>Payment</h2><h3>Total ₹{{'%.2f'|format(amount)}}</h3><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><select name="provider"><option>Cash</option><option>UPI</option><option>Online Gateway</option>{% if razorpay_order %}<option selected>Razorpay</option>{% endif %}</select><input name="transaction_id" placeholder="Transaction / reference ID"><button>Record Payment</button></form>{% if razorpay_order %}<hr><button id="rzp">Pay online with Razorpay</button><form id="verify" method="post" action="{{url_for('razorpay_verify')}}"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="booking_id" value="{{b.id}}"><input type="hidden" name="razorpay_order_id"><input type="hidden" name="razorpay_payment_id"><input type="hidden" name="razorpay_signature"></form><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>document.getElementById('rzp').onclick=function(){var o={key:'{{config.RAZORPAY_KEY_ID}}',amount:{{razorpay_order.amount}},currency:'INR',name:'{{settings.app_name}}',order_id:'{{razorpay_order.id}}',handler:function(r){document.querySelector('[name=razorpay_order_id]').value=r.razorpay_order_id;document.querySelector('[name=razorpay_payment_id]').value=r.razorpay_payment_id;document.querySelector('[name=razorpay_signature]').value=r.razorpay_signature;document.getElementById('verify').submit();}};new Razorpay(o).open();}</script>{% else %}<p class="notice">Real Razorpay online payment activates after RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET are configured on the server.</p>{% endif %}</div>{% endblock %}
